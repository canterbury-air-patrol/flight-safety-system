name: C/C++ CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # ─── 1. Build, unit tests, distcheck ─────────────────────────────────────
  build-and-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests --enable-server --enable-fake-client

    - name: make
      run: make -j$(nproc)

    - name: make check
      run: make check

    - name: collect Catch2 traceability
      run: python3 tools/collect_catch2_traceability.py

    - name: Upload Catch2 traceability artifact
      uses: actions/upload-artifact@v7
      with:
        name: catch2-traceability
        path: tests/catch2-traceability.json
        retention-days: 14

    - name: prepare venv for distcheck
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -r e2e/requirements.txt
    - name: make distcheck
      run: |
        source .venv/bin/activate
        make distcheck

  # ─── 2. Valgrind memory check ─────────────────────────────────────────────
  unit-tests-valgrind:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin valgrind

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests

    - name: build test binary
      run: make -j$(nproc) && cd tests && make -j$(nproc) all_test

    - name: valgrind
      working-directory: tests
      run: |
        LD_LIBRARY_PATH=$(pwd)/../src/.libs \
        valgrind \
          --leak-check=full \
          --error-exitcode=1 \
          --suppressions=../valgrind.supp \
          .libs/all_test

  # ─── 3. Coverage collection and upload ───────────────────────────────────
  #
  # This job measures the *combined* number: the unit suite against a live
  # database plus the e2e suite against the instrumented server. Both are
  # needed for the figure to mean anything — without a database the 30
  # live-DB unit cases skip (db.cpp reads 13 % instead of 96 %), and without
  # e2e nothing exercises server.cpp at all.
  #
  # The e2e run is duplicated here rather than instrumenting job 5: that job
  # is the gate, and gcov-instrumented binaries change the timing its resend
  # windows and 120 s cap depend on. It is `continue-on-error` here for the
  # same reason — a flake in the instrumented copy must not fail the pipeline
  # or block the upload, because job 5 remains the real verdict.
  coverage:
    runs-on: ubuntu-latest
    needs: build-and-check

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin lcov \
          postgresql-client python3-pip python3-venv

    - name: autogen
      run: ./autogen.sh

    # --enable-server and --enable-fake-client are what the e2e step below
    # needs; instrumenting them is also the only way server.cpp is measured.
    - name: configure with coverage
      run: ./configure --enable-tests --enable-server --enable-fake-client --enable-coverage

    - name: make
      run: make -j$(nproc)

    # Two databases: `unit` carries the schema plus the fixtures the live-DB
    # unit cases expect, `e2e` is left empty for the suite's own migrated_db
    # fixture to populate.
    - name: Provision databases
      env:
        PGPASSWORD: e2e
      run: |
        psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE unit;'
        psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE e2e;'
        psql -h 127.0.0.1 -U postgres -d unit -f e2e/schema/001_init.sql
        psql -h 127.0.0.1 -U postgres -d unit -f tests/db-fixtures.sql

    - name: make check
      env:
        TEST_DB_HOST: 127.0.0.1
        TEST_DB_PORT: "5432"
        TEST_DB_USER: postgres
        TEST_DB_PASS: e2e
        TEST_DB_NAME: unit
      run: make check

    - name: Install Python deps
      run: |
        python3 -m venv e2e/.venv
        e2e/.venv/bin/pip install -q -r e2e/requirements.txt

    - name: Run E2E tests (instrumented)
      continue-on-error: true
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGPASSWORD: e2e
        FSS_E2E_EXTERNAL_DB: "host=127.0.0.1 port=5432 user=postgres password=e2e dbname=e2e"
      run: |
        cd e2e
        .venv/bin/pytest -q --timeout=120

    # Capture src/ *and* tests/: the inline bodies in src/*.hpp are attributed
    # to whichever translation unit instantiated them, and for headers like
    # server-failsafe.hpp that is only ever a test TU. Capturing src/ alone
    # reported the whole db_failsafe class as unreachable while
    # server_failsafe_test.cpp covered every line of it.
    #
    # The removal patterns therefore drop the test *sources* rather than the
    # tests/ directory, so those header records survive the filter.
    - name: Capture coverage
      run: |
        lcov --capture \
             --directory src \
             --directory tests \
             --output-file cov.info \
             --ignore-errors mismatch,empty,inconsistent
        lcov --remove cov.info \
             '/usr/*' '*/tests/*.cpp' '*/tests/*.hpp' \
             --output-file cov.info \
             --ignore-errors unused,inconsistent

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: cov.info
        fail_ci_if_error: false

    - name: Generate HTML report
      run: genhtml cov.info --output-directory cov-html

    - name: Upload HTML artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-html
        path: cov-html
        retention-days: 14

  # ─── 4. Static analysis ───────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin \
          cppcheck clang-tidy bear

    # clang-format and ruff output is version-dependent; pin the exact versions
    # the tree is checked with so the gates are reproducible.
    - name: Install pinned clang-format
      run: |
        python3 -m venv /tmp/clang-format-venv
        /tmp/clang-format-venv/bin/pip install -q clang-format==22.1.5

    - name: Install pinned ruff
      run: |
        python3 -m venv /tmp/ruff-venv
        /tmp/ruff-venv/bin/pip install -q -r e2e/requirements-dev.txt

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests --enable-server --enable-fake-client

    - name: build with compile DB
      run: bear -- make -j$(nproc)

    - name: code checks (clang-format, cppcheck, clang-tidy, ruff)
      run: |
        CLANG_FORMAT=/tmp/clang-format-venv/bin/clang-format \
        RUFF=/tmp/ruff-venv/bin/ruff \
        ./check-code.sh

  # ─── 5. End-to-end tests ─────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-check

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin \
          python3-pip python3-venv

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-server --enable-fake-client

    - name: make
      run: make -j$(nproc)

    - name: Install Python deps
      run: |
        python3 -m venv e2e/.venv
        e2e/.venv/bin/pip install -q -r e2e/requirements.txt

    - name: Run E2E tests
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGPASSWORD: e2e
        # Use the pre-started service instead of spinning up docker-in-docker
        FSS_E2E_EXTERNAL_DB: "host=127.0.0.1 port=5432 user=postgres password=e2e dbname=postgres"
      run: |
        cd e2e
        .venv/bin/pytest -v --timeout=120

    - name: Upload e2e traceability artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-traceability
        path: e2e/traceability.json
        retention-days: 14

  # ─── 6. Merge traceability evidence ──────────────────────────────────────
  traceability:
    runs-on: ubuntu-latest
    needs: [ build-and-check, e2e ]
    steps:
    - uses: actions/checkout@v7

    - name: Download Catch2 traceability artifact
      uses: actions/download-artifact@v8
      with:
        name: catch2-traceability
        path: tests

    - name: Download e2e traceability artifact
      uses: actions/download-artifact@v8
      with:
        name: e2e-traceability
        path: e2e

    - name: Merge into one report
      run: python3 tools/merge_traceability.py tests/catch2-traceability.json e2e/traceability.json

    - name: Upload merged traceability artifact
      uses: actions/upload-artifact@v7
      with:
        name: traceability-report
        path: traceability-report.json
        retention-days: 14

  # ─── 7. ThreadSanitizer: full unit suite + concurrency stress tests ──────
  thread-sanitizer:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin

    - name: autogen
      run: ./autogen.sh

    # --enable-tsan instruments the whole tree (libraries + tests + concurrency
    # binary), so the full all_test runs race-checked — not just the dedicated
    # concurrency binary. Mutually exclusive with --enable-coverage, so this is
    # its own job.
    - name: configure with thread sanitizer
      run: ./configure --enable-tests --enable-tsan

    - name: make
      run: make -j$(nproc)

    # check-tsan runs the full all_test *and* the concurrency stress binary under
    # TSan in one step, with tests/tsan.supp (narrowly-scoped, documented
    # kernel-synchronised false positives). `make check` would also run all_test
    # under TSan (AM_TESTS_ENVIRONMENT wires the suppressions in), but that would
    # double-run the slow suite, so this job uses check-tsan alone.
    - name: run the full suite + concurrency stress tests under TSan
      run: make -C tests check-tsan

    - name: show test logs on failure
      if: failure()
      run: cat tests/*.log 2>/dev/null || true

  # ─── 8. AddressSanitizer + UndefinedBehaviorSanitizer ────────────────────
  sanitizers:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v7

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin

    - name: autogen
      run: ./autogen.sh

    # ASan and UBSan are mutually exclusive with TSan; this is a separate job.
    # -Wno-maybe-uninitialized suppresses a GCC false-positive in system
    # headers (<regex> / std::function) triggered at -O1 in GCC 16+.
    - name: configure with address and undefined-behaviour sanitizers
      run: |
        ./configure --enable-tests \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1 -g -Wno-maybe-uninitialized" \
          LDFLAGS="-fsanitize=address,undefined"

    - name: make
      run: make -j$(nproc)

    - name: make check (ASan + UBSan)
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: make check

    # The automake test driver buries the sanitizer report in log files;
    # without this step a failure here is undiagnosable from the job log.
    - name: show test logs on failure
      if: failure()
      run: |
        cat tests/*.log 2>/dev/null || true
