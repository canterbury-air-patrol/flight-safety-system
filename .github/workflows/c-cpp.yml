name: C/C++ CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # ─── 1. Build, unit tests, distcheck ─────────────────────────────────────
  build-and-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests --enable-server --enable-fake-client

    - name: make
      run: make -j$(nproc)

    - name: make check
      run: make check

    - name: prepare venv for distcheck
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -r e2e/requirements.txt
    - name: make distcheck
      run: |
        source .venv/bin/activate
        make distcheck

  # ─── 2. Valgrind memory check ─────────────────────────────────────────────
  unit-tests-valgrind:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin valgrind

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests

    - name: build test binary
      run: make -j$(nproc) && cd tests && make -j$(nproc) all_test

    - name: valgrind
      working-directory: tests
      run: |
        LD_LIBRARY_PATH=$(pwd)/../src/.libs \
        valgrind \
          --leak-check=full \
          --error-exitcode=1 \
          .libs/all_test

  # ─── 3. Coverage collection and upload ───────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin lcov

    - name: autogen
      run: ./autogen.sh

    - name: configure with coverage
      run: ./configure --enable-tests --enable-coverage

    - name: make
      run: make -j$(nproc)

    - name: make check
      run: make check

    - name: Capture coverage
      run: |
        lcov --capture \
             --directory src \
             --output-file cov.info \
             --ignore-errors mismatch,empty
        lcov --remove cov.info \
             '/usr/*' '*/tests/*' \
             --output-file cov.info \
             --ignore-errors unused

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: cov.info
        fail_ci_if_error: false

    - name: Generate HTML report
      run: genhtml cov.info --output-directory cov-html

    - name: Upload HTML artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-html
        path: cov-html
        retention-days: 14

  # ─── 4. Static analysis ───────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin \
          cppcheck clang-tidy bear

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-tests --enable-server --enable-fake-client

    - name: build with compile DB
      run: bear -- make -j$(nproc)

    - name: cppcheck
      run: |
        cppcheck \
          --enable=warning,performance,portability,style \
          --error-exitcode=1 \
          --suppressions-list=.cppcheck-suppress \
          src/*.cpp

    - name: clang-tidy
      run: |
        run-clang-tidy \
          -p . \
          'src/(?!server-db).*\.cpp$' \
          2>&1 | tee clang-tidy.log
        # Fail if any warnings were emitted
        ! grep -q "warning:" clang-tidy.log

  # ─── 5. End-to-end tests (continue-on-error while flakes settle) ─────────
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-check
    continue-on-error: true

    services:
      postgres:
        image: mdillon/postgis:11-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libjsoncpp-dev libecpg-dev catch2 libgnutls28-dev gnutls-bin \
          python3-pip python3-venv

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure --enable-server --enable-fake-client

    - name: make
      run: make -j$(nproc)

    - name: Install Python deps
      run: |
        python3 -m venv e2e/.venv
        e2e/.venv/bin/pip install -q -r e2e/requirements.txt

    - name: Run E2E tests
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGPASSWORD: e2e
        # Use the pre-started service instead of spinning up docker-in-docker
        FSS_E2E_EXTERNAL_DB: "host=127.0.0.1 port=5432 user=postgres password=e2e dbname=postgres"
      run: |
        cd e2e
        .venv/bin/pytest -v --timeout=120
